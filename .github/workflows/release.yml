name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag (e.g. v1.0.0). Leave empty to use package.json version.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Resolve Version and Metadata
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            PKG_VER=$(node -p "require('./package.json').version || '1.0.0'")
            TAG="v${PKG_VER}"
          fi

          CLEAN_VER="${TAG#v}"
          VERSION_CODE="${{ github.run_number }}"
          if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" -le 0 ]; then
            VERSION_CODE=1
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version_name=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "Building version ${CLEAN_VER} (tag: ${TAG}, code: ${VERSION_CODE})"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build web application
        run: pnpm build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Release keystore secrets are not configured (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          mkdir -p android
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          cat <<EOF > android/keystore.properties
storeFile=release.keystore
storePassword=${STORE_PASS}
keyAlias=${KEY_ALIAS}
keyPassword=${KEY_PASS}
EOF

      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PversionName=${{ steps.vars.outputs.version_name }} -PversionCode=${{ steps.vars.outputs.version_code }}

      - name: Package Release Assets
        run: |
          mkdir -p dist-release
          APK_SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          TAG="${{ steps.vars.outputs.tag }}"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "Error: Release APK not found at $APK_SOURCE"
            exit 1
          fi

          cp "$APK_SOURCE" "dist-release/halgheh-${TAG}.apk"
          ls -la dist-release/

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: halgheh-${{ steps.vars.outputs.tag }}-apk
          path: dist-release/halgheh-${{ steps.vars.outputs.tag }}.apk
          retention-days: 30

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "حلقه ${{ steps.vars.outputs.tag }}"
          files: |
            dist-release/halgheh-${{ steps.vars.outputs.tag }}.apk
          draft: ${{ github.event.inputs.draft == true }}
          prerelease: ${{ github.event.inputs.prerelease == true }}
          generate_release_notes: true
          body: |
            ## 📱 حلقه (Halgheh) - نسخه ${{ steps.vars.outputs.tag }}

            تقویم فارسی، آفلاین و سبک برای اندروید (نسخه ۸ به بالا).

            ### دانلود
            - 📥 **[halgheh-${{ steps.vars.outputs.tag }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/halgheh-${{ steps.vars.outputs.tag }}.apk)**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
