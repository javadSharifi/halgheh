<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3e63dd" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="حلقه" />
    <script>
      // set the theme before the first paint so a dark phone never flashes light
      try {
        var s = JSON.parse(localStorage.getItem('halgheh:settings')) || {};
        var t = s.theme;
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        // the language decides the reading direction, so it has to land before the first paint too
        document.documentElement.lang = s.lang === 'en' ? 'en' : 'fa';
        document.documentElement.dir = s.lang === 'en' ? 'ltr' : 'rtl';
      } catch (e) {}
    </script>
    <title>حلقه</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
